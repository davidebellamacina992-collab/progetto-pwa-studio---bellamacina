services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contabilita
      POSTGRES_USER: contabilita
      POSTGRES_PASSWORD: contabilita
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contabilita -d contabilita"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
