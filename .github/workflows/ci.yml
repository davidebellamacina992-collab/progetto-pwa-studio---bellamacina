name: Qualita
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: contabilita
          POSTGRES_USER: contabilita
          POSTGRES_PASSWORD: contabilita
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contabilita -d contabilita"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://contabilita:contabilita@localhost:5432/contabilita?schema=public
      APP_BASE_URL: http://localhost:3000
      SEED_DEMO_PASSWORD: CambiaSubito-CI-2026!
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
